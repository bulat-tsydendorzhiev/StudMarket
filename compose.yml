name: studmarket

services:
  auth-db:
    image: docker.io/library/postgres:16-alpine
    environment:
      POSTGRES_USER: studmarket
      POSTGRES_PASSWORD: studmarket
      POSTGRES_DB: auth_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studmarket -d auth_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [backend]

  listing-db:
    image: docker.io/library/postgres:16-alpine
    environment:
      POSTGRES_USER: studmarket
      POSTGRES_PASSWORD: studmarket
      POSTGRES_DB: listing_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studmarket -d listing_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [backend]

  chat-db:
    image: docker.io/library/postgres:16-alpine
    environment:
      POSTGRES_USER: studmarket
      POSTGRES_PASSWORD: studmarket
      POSTGRES_DB: chat_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studmarket -d chat_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [backend]

  auth-service:
    build: ./backend/auth_service
    environment:
      SERVICE_NAME: auth-service
      DATABASE_URL: postgresql+psycopg://studmarket:studmarket@auth-db:5432/auth_db
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-in-production-0123456789}
    depends_on:
      auth-db:
        condition: service_healthy
    networks: [backend]

  listing-service:
    build: ./backend/listing_service
    environment:
      SERVICE_NAME: listing-service
      DATABASE_URL: postgresql+psycopg://studmarket:studmarket@listing-db:5432/listing_db
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-in-production-0123456789}
      UPLOAD_DIR: /uploads
    depends_on:
      listing-db:
        condition: service_healthy
    volumes:
      - listing-uploads:/uploads
    networks: [backend]

  chat-service:
    build: ./backend/chat_service
    environment:
      SERVICE_NAME: chat-service
      DATABASE_URL: postgresql+psycopg://studmarket:studmarket@chat-db:5432/chat_db
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-in-production-0123456789}
      LISTING_SERVICE_URL: http://listing-service:8000
    depends_on:
      chat-db:
        condition: service_healthy
    networks: [backend]

  api-gateway:
    build: ./backend/api_gateway
    environment:
      SERVICE_NAME: api-gateway
      AUTH_SERVICE_URL: http://auth-service:8000
      LISTING_SERVICE_URL: http://listing-service:8000
      CHAT_SERVICE_URL: http://chat-service:8000
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    depends_on:
      - auth-service
      - listing-service
      - chat-service
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [backend]

  frontend:
    build: ./frontend
    volumes:
      - frontend-dist:/app/dist
    restart: "no"
    networks: [backend]

  nginx:
    image: docker.io/library/nginx:alpine
    depends_on:
      api-gateway:
        condition: service_healthy
      frontend:
        condition: service_completed_successfully
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - frontend-dist:/usr/share/nginx/html:ro
    ports:
      - "${NGINX_PORT:-80}:80"
    networks: [backend]

networks:
  backend:
    driver: bridge

volumes:
  listing-uploads:
  frontend-dist: